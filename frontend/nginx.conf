server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Anything starting with /api/ is passed on to the API container.
    # So the React code can just call "/api/emergency/v1/..." – no CORS setup needed.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Everything else is the React app. Unknown paths (e.g. /emergency/warnings)
    # go to index.html so React's router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
